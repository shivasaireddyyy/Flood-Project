name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Your FloodShield server address (leave empty to type it inside the app)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Copy the web app (and bake in the server address)
        env:
          FS_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: node copy-web.js

      - name: Create the Android project
        run: npx cap add android

      - name: Add permissions and icon
        run: python3 patch_android.py

      - name: Sync web files and plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodShield-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
